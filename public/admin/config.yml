{
  "backend": {
    "name": "github",
    "repo": "CodeMan2834/nextbody-independentstation",
    "branch": "main",
    "base_url": "https://nexbodyfit.com",
    "auth_endpoint": "api/admin/auth"
  },
  "media_folder": "public/images/uploads",
  "public_folder": "/images/uploads",
  "collections": [
    {
      "name": "settings",
      "label": "⚙️ 全站设置",
      "description": "维护品牌名称、联系方式、导航和社交链接；保存后会应用到全站。",
      "extension": "json",
      "format": "json",
      "create": false,
      "delete": false,
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "site-settings",
          "label": "联系信息与社交账号",
          "file": "content/site-settings.json",
          "fields": [
            {
              "name": "siteName",
              "label": "网站名称",
              "widget": "string",
              "default": "NEXBODY"
            },
            {
              "name": "tagline",
              "label": "宣传短句",
              "widget": "string",
              "default": "See Your Body in a New Dimension"
            },
            {
              "name": "contactEmail",
              "label": "联系邮箱",
              "widget": "string",
              "default": "info@nexbodyfit.com",
              "hint": "统一用于网站展示、询盘收件和询盘发件；邮箱须已开通，所属域名须在 Resend 验证。旧 EMAIL_TO / EMAIL_FROM 环境变量不再覆盖此配置。",
              "pattern": [
                "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$",
                "联系邮箱：格式不正确"
              ]
            },
            {
              "name": "whatsappNumber",
              "label": "WhatsApp号码（E.164格式）",
              "widget": "string",
              "hint": "例如 +971501234567；保留占位号码时前台不会显示 WhatsApp 按钮。",
              "default": "+971000000000",
              "required": false,
              "pattern": [
                "^\\+[1-9]\\d{7,14}$",
                "WhatsApp：请填写 +国家码和号码"
              ]
            },
            {
              "name": "nav",
              "label": "全站导航（页头和页脚）",
              "widget": "list",
              "summary": "{{label}} → {{href}}",
              "fields": [
                {
                  "name": "label",
                  "label": "名称",
                  "widget": "string"
                },
                {
                  "name": "href",
                  "label": "链接",
                  "widget": "string"
                }
              ],
              "min": 1
            },
            {
              "name": "socialLinks",
              "label": "社交媒体链接",
              "widget": "list",
              "summary": "{{label}}: {{href}}",
              "fields": [
                {
                  "name": "label",
                  "label": "平台名称",
                  "widget": "string"
                },
                {
                  "name": "href",
                  "label": "链接",
                  "widget": "string"
                }
              ],
              "required": false,
              "hint": "仅填写已确认归属的官方账号；留空则不展示。"
            },
            {
              "name": "homeNav",
              "label": "首页补充导航",
              "widget": "list",
              "fields": [
                {
                  "name": "label",
                  "label": "名称",
                  "widget": "string"
                },
                {
                  "name": "href",
                  "label": "链接",
                  "widget": "string"
                }
              ],
              "min": 1
            },
            {
              "name": "headerCta",
              "label": "页头咨询按钮",
              "widget": "object",
              "fields": [
                {
                  "name": "label",
                  "label": "名称",
                  "widget": "string"
                },
                {
                  "name": "href",
                  "label": "链接",
                  "widget": "string"
                }
              ]
            }
          ]
        }
      ]
    },
    {
      "name": "products",
      "label": "📦 产品管理",
      "label_singular": "产品",
      "description": "维护 X60、OneScan、F20 的介绍、参数、图片和下载资料。",
      "extension": "json",
      "format": "json",
      "create": false,
      "delete": false,
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "products",
          "label": "产品目录",
          "file": "content/products.json",
          "fields": [
            {
              "name": "products",
              "label": "产品列表",
              "widget": "list",
              "summary": "{{name}} — {{tagline}}",
              "fields": [
                {
                  "name": "slug",
                  "label": "页面标识",
                  "widget": "hidden",
                  "hint": "系统标识决定页面地址，已有产品不要修改。"
                },
                {
                  "name": "name",
                  "label": "产品名称",
                  "widget": "string"
                },
                {
                  "name": "shortName",
                  "label": "产品简称",
                  "widget": "string"
                },
                {
                  "name": "category",
                  "label": "产品类别",
                  "widget": "string"
                },
                {
                  "name": "priority",
                  "label": "展示级别",
                  "widget": "hidden",
                  "options": [
                    "flagship",
                    "supporting"
                  ]
                },
                {
                  "name": "tagline",
                  "label": "宣传短句",
                  "widget": "string"
                },
                {
                  "name": "summary",
                  "label": "产品简介",
                  "widget": "text"
                },
                {
                  "name": "image",
                  "label": "产品卡片图片",
                  "widget": "image"
                },
                {
                  "name": "heroImage",
                  "label": "产品页主图",
                  "widget": "image",
                  "hint": "使用原始产品图，避免上传带整页排版文字的宣传册截图。"
                },
                {
                  "name": "workflowImage",
                  "label": "F20 工作流程图片",
                  "widget": "image",
                  "required": false,
                  "hint": "F20 产品页流程区配图，建议使用完整 16:9 场景图。"
                },
                {
                  "name": "accent",
                  "label": "主题色",
                  "widget": "select",
                  "options": [
                    "blue",
                    "gold",
                    "cyan"
                  ]
                },
                {
                  "name": "facts",
                  "label": "核心卖点",
                  "widget": "list",
                  "field": {
                    "name": "entry",
                    "label": "卖点",
                    "widget": "string"
                  },
                  "min": 1
                },
                {
                  "name": "features",
                  "label": "功能列表",
                  "widget": "list",
                  "summary": "{{fields.entry}}",
                  "field": {
                    "name": "entry",
                    "label": "功能说明",
                    "widget": "string"
                  },
                  "min": 1
                },
                {
                  "name": "specs",
                  "label": "规格参数",
                  "widget": "list",
                  "summary": "{{label}}: {{value}}",
                  "fields": [
                    {
                      "name": "label",
                      "label": "名称",
                      "widget": "string"
                    },
                    {
                      "name": "value",
                      "label": "参数值",
                      "widget": "string"
                    }
                  ],
                  "min": 1
                },
                {
                  "name": "highlights",
                  "label": "应用亮点",
                  "widget": "list",
                  "summary": "{{fields.entry}}",
                  "field": {
                    "name": "entry",
                    "label": "亮点",
                    "widget": "string"
                  },
                  "min": 1
                },
                {
                  "name": "reports",
                  "label": "报告类型",
                  "widget": "list",
                  "summary": "{{fields.entry}}",
                  "field": {
                    "name": "entry",
                    "label": "报告名称",
                    "widget": "string"
                  },
                  "min": 1
                },
                {
                  "name": "industries",
                  "label": "适用行业",
                  "widget": "list",
                  "summary": "{{fields.entry}}",
                  "field": {
                    "name": "entry",
                    "label": "行业",
                    "widget": "string"
                  },
                  "min": 1
                },
                {
                  "name": "downloads",
                  "label": "下载资料",
                  "widget": "list",
                  "required": false,
                  "fields": [
                    {
                      "name": "label",
                      "label": "名称",
                      "widget": "string"
                    },
                    {
                      "name": "href",
                      "label": "文件或链接",
                      "widget": "file"
                    }
                  ]
                },
                {
                  "name": "story",
                  "label": "产品场景展示",
                  "widget": "object",
                  "fields": [
                    {
                      "name": "eyebrow",
                      "label": "引导小标题",
                      "widget": "string"
                    },
                    {
                      "name": "title",
                      "label": "标题",
                      "widget": "string"
                    },
                    {
                      "name": "body",
                      "label": "说明文案",
                      "widget": "text"
                    },
                    {
                      "name": "video",
                      "label": "视频文件（MP4）",
                      "widget": "file",
                      "required": false,
                      "hint": "X60、OneScan 需填写。F20 可留空以显示工作流程图片，填写后会改为显示视频。"
                    },
                    {
                      "name": "poster",
                      "label": "视频封面图",
                      "widget": "image",
                      "required": false,
                      "hint": "配置了场景视频时必须填写封面图。"
                    }
                  ]
                }
              ],
              "allow_add": false,
              "allow_delete": false,
              "min": 3,
              "max": 3,
              "hint": "维护既有三款产品，可拖动排序。新增/移除产品或修改地址需开发人员处理。"
            }
          ]
        }
      ]
    },
    {
      "name": "cases",
      "label": "📋 应用案例",
      "label_singular": "应用案例",
      "description": "维护首页展示的真实应用场景；未获授权时不要填写客户名称或 Logo。",
      "extension": "json",
      "format": "json",
      "create": false,
      "delete": false,
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "cases",
          "label": "案例列表",
          "file": "content/cases.json",
          "fields": [
            {
              "name": "cases",
              "label": "案例列表",
              "widget": "list",
              "summary": "{{name}} — {{product}}",
              "fields": [
                {
                  "name": "id",
                  "label": "唯一编号",
                  "widget": "string"
                },
                {
                  "name": "name",
                  "label": "案例名称",
                  "widget": "string",
                  "hint": "后台识别用名称，不直接显示在前台。",
                  "required": false
                },
                {
                  "name": "context",
                  "label": "应用场景",
                  "widget": "string"
                },
                {
                  "name": "industry",
                  "label": "行业",
                  "widget": "string",
                  "hint": "内部维护备注，不直接显示在前台。",
                  "required": false
                },
                {
                  "name": "product",
                  "label": "产品",
                  "widget": "select",
                  "options": [
                    "Nexbody-X60",
                    "OneScan",
                    "F20"
                  ]
                },
                {
                  "name": "headline",
                  "label": "案例标题",
                  "widget": "string"
                },
                {
                  "name": "need",
                  "label": "客户需求",
                  "widget": "text",
                  "hint": "内部维护备注，不直接显示在前台。",
                  "required": false
                },
                {
                  "name": "approach",
                  "label": "解决方式",
                  "widget": "text",
                  "hint": "内部维护备注，不直接显示在前台。",
                  "required": false
                },
                {
                  "name": "result",
                  "label": "应用结果",
                  "widget": "text"
                },
                {
                  "name": "media",
                  "label": "案例媒体",
                  "widget": "object",
                  "fields": [
                    {
                      "name": "src",
                      "label": "图片",
                      "widget": "image",
                      "hint": "建议使用 16:10 的 WebP 图片，并填写图片说明。"
                    },
                    {
                      "name": "alt",
                      "label": "图片说明",
                      "widget": "string"
                    }
                  ]
                }
              ],
              "required": false,
              "hint": "全部案例按列表顺序展示，可新增、排序或删除。"
            }
          ]
        }
      ]
    },
