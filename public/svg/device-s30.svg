<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" fill="none" role="img" aria-label="NextBody S30 body scanner">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- base -->
  <ellipse cx="210" cy="530" rx="130" ry="18" fill="#0066ff" opacity="0.18"/>
  <rect x="95" y="480" width="230" height="36" rx="8" fill="#0c1018" stroke="#1a2540" stroke-width="1.5"/>
  <!-- tower -->
  <rect x="130" y="120" width="160" height="370" rx="12" fill="#10141f" stroke="#243048" stroke-width="1.5"/>
  <rect x="148" y="145" width="124" height="200" rx="8" fill="url(#screen)" stroke="#0066ff" stroke-width="1" opacity="0.95"/>
  <!-- scan UI lines -->
  <rect x="162" y="168" width="96" height="3" rx="1.5" fill="#00e5ff" opacity="0.7"/>
  <rect x="162" y="182" width="72" height="2" rx="1" fill="#334466" opacity="0.8"/>
  <rect x="162" y="192" width="84" height="2" rx="1" fill="#334466" opacity="0.6"/>
  <!-- body silhouette on screen -->
  <path d="M210 210c-18 0-32 14-32 32v24c0 10 8 18 18 18h28c10 0 18-8 18-18v-24c0-18-14-32-32-32z" fill="#00e5ff" opacity="0.25"/>
  <path d="M210 284v72c-22 0-40 18-40 40v28h80v-28c0-22-18-40-40-40v-72z" fill="#00e5ff" opacity="0.18"/>
  <!-- scan line -->
  <rect x="148" y="248" width="124" height="2" fill="url(#accent)" filter="url(#glow)" opacity="0.9"/>
  <!-- camera bar -->
  <rect x="148" y="360" width="124" height="48" rx="6" fill="#080c14" stroke="#0066ff" stroke-width="1" opacity="0.9"/>
  <circle cx="178" cy="384" r="10" fill="#0066ff" opacity="0.5"/>
  <circle cx="210" cy="384" r="10" fill="#00e5ff" opacity="0.6"/>
  <circle cx="242" cy="384" r="10" fill="#0066ff" opacity="0.5"/>
  <!-- top sensor -->
  <rect x="165" y="88" width="90" height="40" rx="20" fill="#141824" stroke="#0066ff" stroke-width="1.5"/>
  <rect x="195" y="98" width="30" height="20" rx="10" fill="#00e5ff" opacity="0.35"/>
  <!-- side accents -->
  <rect x="118" y="200" width="6" height="120" rx="3" fill="#0066ff" opacity="0.35"/>
  <rect x="296" y="200" width="6" height="120" rx="3" fill="#00e5ff" opacity="0.35"/>
</svg>
