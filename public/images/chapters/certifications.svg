<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,102,255,0.2)"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg2)"/>

  <!-- 4 Badge cards -->
  <g transform="translate(260, 350)">
    <!-- CE Mark -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="200" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="100" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-0.02em">CE</text>
      <text x="100" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">European Conformity</text>
      <rect x="60" y="155" width="80" height="2" fill="rgba(0,102,255,0.4)" rx="1"/>
    </g>
  </g>

  <g transform="translate(520, 350)">
    <!-- ISO 13485 -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="200" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="100" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="white" letter-spacing="-0.02em">ISO</text>
      <text x="100" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">13485</text>
      <text x="100" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Quality Management</text>
      <text x="100" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Medical Devices</text>
      <rect x="60" y="175" width="80" height="2" fill="rgba(0,102,255,0.4)" rx="1"/>
    </g>
  </g>

  <g transform="translate(780, 350)">
    <!-- Data Privacy -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="200" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Shield icon -->
      <path d="M100 40 L140 55 L140 90 Q140 125 100 145 Q60 125 60 90 L60 55 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <text x="100" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">GDPR</text>
      <text x="100" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Data Protection</text>
      <text x="100" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Encrypted at Rest</text>
      <rect x="60" y="175" width="80" height="2" fill="rgba(0,102,255,0.4)" rx="1"/>
    </g>
  </g>

  <g transform="translate(1040, 350)">
    <!-- Cloud Security -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="200" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Cloud icon -->
      <path d="M75 75 Q75 55 90 50 Q95 35 110 35 Q125 35 130 50 Q145 50 145 65 Q155 70 152 85 Q145 95 130 95 L80 95 Q68 95 68 80 Q68 72 75 75Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <text x="100" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" font-weight="600">Cloud Security</text>
      <text x="100" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Role-Based Access</text>
      <text x="100" y="161" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Regional Deployment</text>
      <rect x="60" y="180" width="80" height="2" fill="rgba(0,102,255,0.4)" rx="1"/>
    </g>
  </g>

  <!-- Labels at bottom -->
  <text x="720" y="650" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.35)">Certifications independently verified</text>
</svg>
