<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="0.5">
    <line x1="200" y1="150" x2="200" y2="750"/>
    <line x1="400" y1="150" x2="400" y2="750"/>
    <line x1="600" y1="150" x2="600" y2="750"/>
    <line x1="800" y1="150" x2="800" y2="750"/>
    <line x1="1000" y1="150" x2="1000" y2="750"/>
    <line x1="1200" y1="150" x2="1200" y2="750"/>
    <line x1="180" y1="150" x2="1260" y2="150"/>
    <line x1="180" y1="300" x2="1260" y2="300"/>
    <line x1="180" y1="450" x2="1260" y2="450"/>
    <line x1="180" y1="600" x2="1260" y2="600"/>
    <line x1="180" y1="750" x2="1260" y2="750"/>
  </g>

  <!-- Axes -->
  <line x1="180" y1="750" x2="1260" y2="750" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="180" y1="150" x2="180" y2="750" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="720" y="800" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">DEXA Measurement</text>
  <text x="50" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)" transform="rotate(-90, 50, 470)">NextBody Measurement</text>

  <!-- 45° reference line (DEXA = NextBody) -->
  <line x1="180" y1="750" x2="1260" y2="150" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- Data points clustered around the 45° line -->
  <g fill="#0066ff" opacity="0.7">
    <circle cx="280" cy="690" r="3.5"/><circle cx="320" cy="650" r="3"/><circle cx="350" cy="670" r="3.5"/>
    <circle cx="400" cy="610" r="3"/><circle cx="420" cy="580" r="3.5"/><circle cx="380" cy="620" r="3"/>
    <circle cx="480" cy="540" r="3"/><circle cx="510" cy="500" r="3.5"/><circle cx="470" cy="530" r="3"/>
    <circle cx="550" cy="460" r="3.5"/><circle cx="580" cy="420" r="3"/><circle cx="530" cy="470" r="3"/>
    <circle cx="620" cy="390" r="3"/><circle cx="660" cy="350" r="3.5"/><circle cx="640" cy="370" r="3"/>
    <circle cx="720" cy="300" r="3.5"/><circle cx="750" cy="270" r="3"/><circle cx="700" cy="310" r="3.5"/>
    <circle cx="800" cy="230" r="3"/><circle cx="830" cy="210" r="3.5"/><circle cx="780" cy="250" r="3"/>
    <circle cx="880" cy="180" r="3"/><circle cx="910" cy="170" r="3.5"/><circle cx="860" cy="200" r="3"/>
    <circle cx="960" cy="160" r="3.5"/><circle cx="1000" cy="155" r="3"/><circle cx="940" cy="175" r="3"/>
  </g>

  <!-- Best-fit line (nearly 45°) -->
  <line x1="200" y1="720" x2="1220" y2="180" stroke="url(#line-grad)" stroke-width="2"/>

  <!-- R value annotation box -->
  <rect x="1040" y="180" width="200" height="80" rx="12" fill="rgba(0,102,255,0.1)" stroke="rgba(0,102,255,0.3)" stroke-width="1"/>
  <text x="1140" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Correlation</text>
  <text x="1140" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#00e5ff">R = 0.96</text>
</svg>
