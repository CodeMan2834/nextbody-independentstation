<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d111a"/><stop offset="100%" stop-color="#0a0a14"/></linearGradient></defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <!-- Interconnected nodes (multi-site network) -->
  <g transform="translate(720,380)">
    <g stroke="rgba(0,102,255,0.12)" stroke-width="0.8">
      <line x1="0" y1="0" x2="-160" y2="-80"/>
      <line x1="0" y1="0" x2="160" y2="-80"/>
      <line x1="0" y1="0" x2="-100" y2="120"/>
      <line x1="0" y1="0" x2="100" y2="120"/>
      <line x1="0" y1="0" x2="0" y2="-160"/>
      <line x1="0" y1="0" x2="0" y2="140"/>
      <line x1="-160" y1="-80" x2="-100" y2="120"/>
      <line x1="160" y1="-80" x2="100" y2="120"/>
      <line x1="-160" y1="-80" x2="160" y2="-80"/>
      <line x1="-100" y1="120" x2="100" y2="120"/>
    </g>
    <!-- Central hub -->
    <circle cx="0" cy="0" r="12" fill="rgba(0,102,255,0.6)"/><circle cx="0" cy="0" r="4" fill="white"/>
    <!-- Satellite nodes -->
    <circle cx="-160" cy="-80" r="8" fill="rgba(0,102,255,0.3)"/><circle cx="-160" cy="-80" r="2.5" fill="white"/>
    <circle cx="160" cy="-80" r="8" fill="rgba(0,102,255,0.3)"/><circle cx="160" cy="-80" r="2.5" fill="white"/>
    <circle cx="-100" cy="120" r="8" fill="rgba(0,102,255,0.3)"/><circle cx="-100" cy="120" r="2.5" fill="white"/>
    <circle cx="100" cy="120" r="8" fill="rgba(0,102,255,0.3)"/><circle cx="100" cy="120" r="2.5" fill="white"/>
    <circle cx="0" cy="-160" r="6" fill="rgba(0,102,255,0.2)"/><circle cx="0" cy="-160" r="2" fill="white"/>
    <circle cx="0" cy="140" r="6" fill="rgba(0,102,255,0.2)"/><circle cx="0" cy="140" r="2" fill="white"/>
  </g>
  <text x="720" y="780" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.25)">Kuala Lumpur, Malaysia · Multi-site Gym Operator</text>
  <rect x="620" y="805" width="200" height="1" fill="rgba(0,102,255,0.15)"/>
</svg>
